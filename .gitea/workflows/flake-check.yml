name: CI & Binary Cache

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  check:
    name: Flake Check
    runs-on: native
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run nix flake check
        run: nix flake check

  build:
    name: Build & Cache (${{ matrix.host }})
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: native
    strategy:
      fail-fast: false
      matrix:
        host:
          - cache
          - fw13p
          - fw16
          - minimal
          - ne4
          - nixos-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build system closure
        run: nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" --no-link

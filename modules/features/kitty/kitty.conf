# See https://sw.kovidgoyal.net/kitty/conf.html
globinclude themes/noctalia.conf

font_family JetBrainsMono Nerd Font
font_size 12

# Shell integration is sourced and configured manually
shell_integration no-rc no-cursor

active_tab_font_style bold
background_blur 1
background_opacity 0.800000
bold_font auto
bold_italic_font auto
cursor_blink_interval 0.250000
cursor_shape beam
cursor_stop_blinking_after 1.500000
enable_audio_bell no
enabled_layouts tall
hide_window_decorations yes
inactive_tab_font_style normal
initial_window_height 750
initial_window_width 1200
italic_font auto
linux_display_server auto
mouse_hide_wait -1
remember_window_size no
scrollback_lines 5000
tab_bar_align left
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
term xterm-kitty
wheel_scroll_multiplier 3.000000
window_border_width 1.5pt
window_margin_width 2
window_padding_width 0

map alt+enter new_window
map alt+h previous_window
map alt+l next_window
map alt+left previous_window
map alt+q close_window
map alt+r start_resizing_window
map alt+right next_window
map ctrl+shift+, change_font_size all -1
map ctrl+shift+. change_font_size all +1
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+right next_tab
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab


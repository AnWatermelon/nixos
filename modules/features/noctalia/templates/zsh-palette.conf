# zsh prompt palette — rendered by noctalia from the wallpaper palette.
# Mirrors lualine_theme() in lua/matugen.lua exactly.
#
# vi-mode pill (lualine section_a):
#   vicmd  -> base0D / primary_container   (lualine "normal"  bg)
#   viins  -> base0B / primary             (lualine "insert"  bg)
#   visual -> base0E / secondary_container (lualine "visual"  bg)
#   fg     -> base01 / surface_container_lowest
VI_MODE_IND_NORMAL_BG='{{colors.primary_container.default.hex}}'
VI_MODE_IND_INSERT_BG='{{colors.primary.default.hex}}'
VI_MODE_IND_VISUAL_BG='{{colors.secondary_container.default.hex}}'
VI_MODE_IND_FG='{{colors.surface_container_lowest.default.hex}}'

# dir segment (lualine section_b):
#   bg -> base02 / surface_container_low
#   fg -> base05 / on_surface
PROMPT_DIR_BG='{{colors.surface_container_low.default.hex}}'
PROMPT_DIR_FG='{{colors.on_surface.default.hex}}'
PROMPT_DIR_MUTED_FG='{{colors.outline_variant.default.hex}}'

# vcs segment (lualine section_c):
#   bg -> base01 / surface_container_lowest
#   fg -> base04 / on_surface_variant
PROMPT_VCS_BG='{{colors.surface_container_lowest.default.hex}}'
PROMPT_VCS_FG='{{colors.on_surface_variant.default.hex}}'
